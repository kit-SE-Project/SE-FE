name: Web integration checks
on:
  pull_request:
    branches: [main, codex/server-allday-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm --prefix apps/server-allday ci --no-audit --no-fund
      - run: npm --prefix apps/server-allday test
      - run: npm run build:allday
      - run: npm run test:web
      - run: npm --prefix apps/se-board ci --legacy-peer-deps --no-audit --no-fund
      - run: npm --prefix apps/se-board test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build:board
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production web image
        run: docker build --file Dockerfile.web --tag se-fe-integrated:ci .
      - name: Check the integrated Nginx image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name se-fe-web-ci -p 127.0.0.1:18090:80 se-fe-integrated:ci
          trap 'docker rm -f se-fe-web-ci >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/ -o /tmp/seboard.html; then break; fi
            sleep 1
          done
          docker exec se-fe-web-ci nginx -t
          curl --fail --silent http://127.0.0.1:18090/ -o /tmp/seboard.html
          curl --fail --silent http://127.0.0.1:18090/allday/ -o /tmp/allday.html
          curl --fail --silent http://127.0.0.1:18090/allday/sso -o /tmp/portal.html
          test -s /tmp/seboard.html
          test -s /tmp/allday.html
          cmp /tmp/seboard.html /tmp/portal.html
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/internal/blocked)" = 404
